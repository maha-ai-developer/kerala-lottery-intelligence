name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Monorepo Typecheck
        run: npm run typecheck

      - name: Run Unit & Invariant Tests
        run: npm run test

      - name: Build Web Application & Services
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: kerala-lottery-intelligence
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: kerala-lottery-intelligence.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: kerala-lottery-intelligence.firebasestorage.app
          NEXT_PUBLIC_FIREBASE_API_KEY: AIzaSyCpxJlxYaM2eVK2NG0pB0-7yLBITsLoBok
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "660682986882"
          NEXT_PUBLIC_FIREBASE_APP_ID: "1:660682986882:web:32a1f0c4549be1f68e2b9b"
