# ==============================================================================
# Kerala State Lottery Intelligence & Experiment Platform
# Firebase App Hosting Configuration (Authoritative)
# Location: apps/web/apphosting.yaml
# App Root: apps/web
# Documentation: https://firebase.google.com/docs/app-hosting/configure
# ==============================================================================

# Cloud Run Container Configuration
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment-Independent Application Metadata
# Target-specific Firebase Web configurations (NEXT_PUBLIC_APP_ENV, NEXT_PUBLIC_FIREBASE_*)
# are provided via App Hosting Backend Environment Variables in the Firebase Console.
env:
  - variable: NEXT_PUBLIC_APP_VERSION
    value: "0.1.0"
    availability:
      - BUILD
      - RUNTIME
