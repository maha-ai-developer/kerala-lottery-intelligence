# ==============================================================================
# Kerala State Lottery Intelligence & Experiment Platform
# Firebase App Hosting Configuration (Authoritative)
# Location: apps/web/apphosting.yaml
# App Root: apps/web
# Documentation: https://firebase.google.com/docs/app-hosting/configure
# ==============================================================================

# Cloud Run Container Configuration
runConfig:
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 10
  concurrency: 80

# Environment Variables
env:
  - variable: NEXT_PUBLIC_APP_ENV
    value: production
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_APP_VERSION
    value: "0.1.0"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: kerala-lottery-intelligence
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: kerala-lottery-intelligence.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: kerala-lottery-intelligence.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyCpxJlxYaM2eVK2NG0pB0-7yLBITsLoBok
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "660682986882"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:660682986882:web:32a1f0c4549be1f68e2b9b"
    availability:
      - BUILD
      - RUNTIME
